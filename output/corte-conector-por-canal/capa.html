<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@800;900&display=swap">
<style>
 *{margin:0;padding:0;box-sizing:border-box}
 body{width:1280px;height:720px;overflow:hidden;background:#07101f;
      font-family:'Archivo',system-ui,sans-serif;position:relative}
 .g1{position:absolute;width:980px;height:980px;border-radius:50%;left:-240px;top:-190px;
     background:radial-gradient(circle,rgba(34,182,224,.34),transparent 62%)}
 .g2{position:absolute;width:820px;height:820px;border-radius:50%;right:-180px;bottom:-280px;
     background:radial-gradient(circle,rgba(255,196,40,.20),transparent 62%)}
 .robo{position:absolute;right:-40px;bottom:-10px;width:690px;z-index:2;
       filter:drop-shadow(-30px 10px 46px rgba(0,0,0,.72))}
 .fade{position:absolute;right:470px;top:0;width:340px;height:720px;z-index:3;
       background:linear-gradient(to left,transparent,#07101f 82%)}
 .left{position:absolute;left:56px;top:122px;width:720px;z-index:4}
 h1{font-weight:900;font-size:106px;line-height:.87;color:#fff;letter-spacing:-3.6px;
    text-shadow:0 10px 36px rgba(0,0,0,.72)}
 h1 .hi{display:block;color:#ffd21e}
 .sub{margin-top:24px;font-size:34px;font-weight:800;color:#b9d4f2;letter-spacing:-.4px}
 .logos{display:flex;gap:16px;align-items:center;margin-top:34px}
 .logos img{height:76px;border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,.66)}
 .mais{font-size:54px;color:#ffd21e;font-weight:900}
</style></head><body>
<div class="g1"></div><div class="g2"></div>
<img class="robo" src="robo.png">
<div class="fade"></div>
<div class="left">
  <h1>UM CONECTOR<span class="hi">POR CANAL</span></h1>
  <div class="sub">no ChatGPT e no Claude</div>
  <div class="logos">
    <img src="L_ml.png"><img src="L_shopee.png">
    <span class="mais">+</span><img src="L_tiktok.png">
  </div>
</div></body></html>
