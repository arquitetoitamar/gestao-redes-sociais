<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<style>
@font-face { font-family: "Inter"; src: url("../assets/Inter.ttf") format("truetype"); font-weight: 100 900; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1350px; overflow: hidden; }
body { font-family: "Inter", sans-serif; -webkit-font-smoothing: antialiased; color: #0b1f5c;
  background: radial-gradient(90% 60% at 85% 70%, #dbe9ff 0%, rgba(219,233,255,0) 60%), linear-gradient(180deg, #ffffff 0%, #f4f8fe 100%); position: relative; }
.logo { position: absolute; left: 72px; top: 62px; height: 150px; }
.pill { position: absolute; right: 72px; top: 92px; background: #facc15; color: #0b1640; border-radius: 999px; padding: 16px 34px;

h1 { position: absolute; left: 66px; top: 262px; font-size: 76px; font-weight: 900; line-height: 1.04; letter-spacing: -.03em; word-spacing: .04em; }
h1 span { color: #2563eb; }
p { position: absolute; left: 72px; top: 452px; width: 940px; font-size: 36px; font-weight: 500; line-height: 1.3; color: #3c4a6b; letter-spacing: -.01em; }
.mock { position: absolute; left: 40px; top: 560px; width: 1040px;
  -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 4%, #000 100%), linear-gradient(180deg, transparent 0, #000 6%, #000 92%, transparent 100%);
  -webkit-mask-composite: source-in; }
.chips { position: absolute; left: 72px; top: 1236px; display: flex; gap: 16px; }
.chip { background: #dcebff; color: #0b2a7a; border-radius: 999px; padding: 14px 26px; font-size: 28px; font-weight: 700; }
.url { position: absolute; right: 72px; top: 1250px; font-size: 32px; font-weight: 800; color: #1597c4; }
</style></head><body>
<img class="logo" src="../assets/logo-tiops.png">
<div class="pill">NOVIDADE</div>

<p>Emita a NF-e dos seus pedidos direto na SEFAZ,<br>em poucos cliques.</p>
<img class="mock" src="mockup.png">
<div class="chips"><span class="chip">Mercado Livre</span><span class="chip">Shopee</span><span class="chip">API e MCP</span></div>

</body></html>
