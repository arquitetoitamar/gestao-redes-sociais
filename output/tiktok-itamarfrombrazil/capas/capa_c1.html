<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@800;900&display=swap">
<style>
 *{margin:0;padding:0;box-sizing:border-box}
 body{width:1080px;height:1920px;overflow:hidden;background:#07101f;
      font-family:'Archivo',system-ui,sans-serif;position:relative}
 .g1{position:absolute;width:1100px;height:1100px;border-radius:50%;left:-320px;top:-220px;
     background:radial-gradient(circle,rgba(34,182,224,.36),transparent 62%)}
 .g2{position:absolute;width:980px;height:980px;border-radius:50%;right:-260px;bottom:-240px;
     background:radial-gradient(circle,rgba(255,196,40,.22),transparent 62%)}
 .robo{position:absolute;right:-150px;bottom:-120px;width:640px;z-index:2;opacity:.55;
       filter:drop-shadow(-30px 10px 46px rgba(0,0,0,.75))}
 .fade{position:absolute;left:0;bottom:0;width:1080px;height:900px;z-index:3;
       background:linear-gradient(to top,#07101f 48%,rgba(7,16,31,.72) 76%,transparent)}
 .pill{position:absolute;left:70px;top:430px;z-index:5;
       background:rgba(34,182,224,.20);border:2px solid rgba(34,182,224,.55);
       color:#6fd6f5;font-size:30px;font-weight:900;letter-spacing:3px;
       padding:12px 26px;border-radius:999px}
 .mid{position:absolute;left:70px;top:520px;width:940px;z-index:5}
 h1{font-weight:900;font-size:148px;line-height:.86;color:#fff;letter-spacing:-5px;
    text-shadow:0 12px 40px rgba(0,0,0,.8)}
 h1 .hi{display:block;color:#ffd21e}
 .sub{margin-top:40px;font-size:46px;font-weight:800;color:#b9d4f2;letter-spacing:-.6px;
      line-height:1.18;max-width:860px}
 .logos{position:absolute;left:70px;top:1510px;z-index:6;display:flex;gap:18px;align-items:center}
 .logos img{height:92px;border-radius:16px;box-shadow:0 14px 36px rgba(0,0,0,.8)}
 .mais{font-size:56px;color:#ffd21e;font-weight:900}
 .site{position:absolute;left:70px;bottom:70px;z-index:5;font-size:30px;font-weight:800;
       color:#7fa6cc;letter-spacing:1px}
</style></head><body>
<div class="g1"></div><div class="g2"></div>
<img class="robo" src="robo.png">
<div class="fade"></div>
<div class="pill">MARKETPLACE CONNECT</div>
<div class="mid">
  <h1>PEDI 13<br>ANÚNCIOS.<span class="hi">A IA SE<br>RECUSOU.</span></h1>
  <div class="sub">Faltava dado obrigatório — e ela não inventou.</div>
</div>
<div class="logos">
  <img src="L_ml.png"><img src="L_shopee.png"><img src="L_tiktok.png">
</div>
<div class="site">marketplaces.tiops.com.br</div>
</body></html>
